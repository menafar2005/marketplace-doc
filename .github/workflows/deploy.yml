name: Deploy docs to Cloudflare

# هر push روی main: تست، ساخت داک از روی ریپو و deploy به Worker «didar-developers-docs».
# هر deploy یک Worker Version جدید می‌سازد که با tag کوتاه commit قابل ردیابی است.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # تمپلیت‌های کد داک (templates/) باید در هر چهار زبان قابل اجرا بمانند
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python
        run: python -m py_compile templates/python/*.py
      - name: PHP
        run: for f in templates/php/*.php; do php -l "$f"; done
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: C#
        run: |
          dotnet new web -o "$RUNNER_TEMP/tpl" --force
          rm "$RUNNER_TEMP/tpl/Program.cs"
          cp templates/csharp/*.cs "$RUNNER_TEMP/tpl/"
          dotnet build "$RUNNER_TEMP/tpl"

  deploy:
    needs: [test, templates]
    # production همیشه از روی main ساخته می‌شود؛ هیچ شاخه‌ی دیگری (حتی با اجرای دستی) deploy نمی‌کند
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy (new Worker version)
        run: |
          MSG="${COMMIT_MESSAGE%%$'\n'*}"
          DOCS_COMMIT_MESSAGE="$MSG" npx wrangler deploy --message "${MSG:0:100}" --tag "${GITHUB_SHA::7}"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
