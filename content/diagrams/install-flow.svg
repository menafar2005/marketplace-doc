<svg viewBox="0 0 780 650" width="100%" role="img" aria-label="جریان نصب اپ: از باز کردن لینک نصب تا ذخیره‌ی نتیجه" xmlns="http://www.w3.org/2000/svg"><style>.d-t{font-family:var(--font-sans);fill:var(--ink);}.d-m{font-family:var(--font-mono);fill:var(--muted);}.d-s{font-family:var(--font-sans);fill:var(--muted);}.d-box{fill:var(--surface-2);stroke:var(--line-strong);}.d-brand{fill:var(--brand-tint);stroke:var(--brand);}.d-life{stroke:var(--line-strong);stroke-dasharray:4 5;}.d-arrow{stroke:var(--brand-strong);fill:none;stroke-width:1.8;}.d-back{stroke:var(--muted);fill:none;stroke-width:1.6;stroke-dasharray:6 4;}.d-head{fill:var(--brand-strong);}.d-headm{fill:var(--muted);}.d-num{fill:var(--brand-strong);}.d-numt{font-family:var(--font-sans);fill:var(--on-brand);font-weight:700;}.d-note{fill:var(--surface);stroke:var(--line);}.d-bad{fill:var(--surface);stroke:var(--danger);}.d-badt{font-family:var(--font-mono);fill:var(--danger);}</style><defs><marker id="dins-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker><marker id="dins-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-headm"/></marker></defs><rect class="d-brand" x="574.0" y="24" width="172" height="56" rx="10"/><text class="d-t" x="660.0" y="48" font-size="15.5" text-anchor="middle" direction="rtl" font-weight="700">ادمین کسب‌وکار</text><text class="d-m" x="660.0" y="68" font-size="12" text-anchor="middle" direction="ltr">browser</text><rect class="d-brand" x="304.0" y="24" width="172" height="56" rx="10"/><text class="d-t" x="390.0" y="48" font-size="15.5" text-anchor="middle" direction="rtl" font-weight="700">دیدار</text><text class="d-m" x="390.0" y="68" font-size="12" text-anchor="middle" direction="ltr">app.didar.me</text><rect class="d-brand" x="34.0" y="24" width="172" height="56" rx="10"/><text class="d-t" x="120.0" y="48" font-size="15.5" text-anchor="middle" direction="rtl" font-weight="700">سرور تو</text><text class="d-m" x="120.0" y="68" font-size="12" text-anchor="middle" direction="ltr">Callback URL</text><line class="d-life" x1="660.0" y1="80" x2="660.0" y2="638"/><line class="d-life" x1="390.0" y1="80" x2="390.0" y2="638"/><line class="d-life" x1="120.0" y1="80" x2="120.0" y2="638"/><text class="d-t" x="525.0" y="114" font-size="15" text-anchor="middle" direction="rtl">لینک نصب اپ را باز می‌کند</text><line class="d-arrow" x1="654.0" y1="137" x2="396.0" y2="137" marker-end="url(#dins-a)"/><circle class="d-num" cx="676.0" cy="136" r="11"/><text class="d-numt" x="676.0" y="141" font-size="13" text-anchor="middle" direction="rtl">۱</text><text class="d-t" x="525.0" y="165" font-size="15" text-anchor="middle" direction="rtl">صفحه‌ی تأیید نصب</text><text class="d-t" x="525.0" y="186" font-size="15" text-anchor="middle" direction="rtl">اپ و سازنده، BizDomain، دسترسی‌ها، کاربران</text><line class="d-back" x1="396.0" y1="209" x2="654.0" y2="209" marker-end="url(#dins-b)"/><text class="d-t" x="525.0" y="237" font-size="15" text-anchor="middle" direction="rtl">«تأیید دسترسی به اطلاعات و نصب»</text><line class="d-arrow" x1="654.0" y1="260" x2="396.0" y2="260" marker-end="url(#dins-a)"/><circle class="d-num" cx="676.0" cy="259" r="11"/><text class="d-numt" x="676.0" y="264" font-size="13" text-anchor="middle" direction="rtl">۲</text><text class="d-t" x="255.0" y="288" font-size="15" text-anchor="middle" direction="rtl">redirect مرورگر به Callback URL</text><text class="d-m" x="255.0" y="309" font-size="12.5" text-anchor="middle" direction="ltr">GET ?code=…&amp;state=…</text><line class="d-arrow" x1="384.0" y1="330" x2="126.0" y2="330" marker-end="url(#dins-a)"/><circle class="d-num" cx="406.0" cy="329" r="11"/><text class="d-numt" x="406.0" y="334" font-size="13" text-anchor="middle" direction="rtl">۳</text><rect class="d-note" x="30.0" y="342" width="180" height="56" rx="8"/><text class="d-s" x="120.0" y="362" font-size="13.5" text-anchor="middle" direction="rtl">state را با session</text><text class="d-s" x="120.0" y="382" font-size="13.5" text-anchor="middle" direction="rtl">مقایسه می‌کند</text><text class="d-t" x="255.0" y="432" font-size="15" text-anchor="middle" direction="rtl">تکمیل نصب (server-to-server)</text><text class="d-m" x="255.0" y="453" font-size="12.5" text-anchor="middle" direction="ltr">POST /api/MarketplaceInstall/CompleteInstallation</text><line class="d-arrow" x1="126.0" y1="474" x2="384.0" y2="474" marker-end="url(#dins-a)"/><circle class="d-num" cx="104.0" cy="473" r="11"/><text class="d-numt" x="104.0" y="478" font-size="13" text-anchor="middle" direction="rtl">۴</text><text class="d-t" x="255.0" y="502" font-size="15" text-anchor="middle" direction="rtl">نتیجه‌ی نصب</text><text class="d-m" x="255.0" y="523" font-size="12.5" text-anchor="middle" direction="ltr">BizDomainId · Scopes · ApiKey · AppPublicId</text><line class="d-back" x1="384.0" y1="544" x2="126.0" y2="544" marker-end="url(#dins-b)"/><rect class="d-note" x="8.0" y="556" width="283.6" height="56" rx="8"/><text class="d-s" x="149.8" y="576" font-size="13.5" text-anchor="middle" direction="rtl">نصب را با BizDomainId ذخیره می‌کند</text><text class="d-s" x="149.8" y="596" font-size="13.5" text-anchor="middle" direction="rtl">و «نصب کامل شد» نشان می‌دهد</text><circle class="d-num" cx="291.6" cy="556" r="11"/><text class="d-numt" x="291.6" y="561" font-size="13" text-anchor="middle" direction="rtl">۵</text></svg>
