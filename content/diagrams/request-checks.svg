<svg viewBox="0 0 760 488" width="100%" role="img" aria-label="بررسی‌های مارکت‌پلیس روی هر درخواست داده: token، scope و Runtime Context" xmlns="http://www.w3.org/2000/svg"><style>.d-t{font-family:var(--font-sans);fill:var(--ink);}.d-m{font-family:var(--font-mono);fill:var(--muted);}.d-s{font-family:var(--font-sans);fill:var(--muted);}.d-box{fill:var(--surface-2);stroke:var(--line-strong);}.d-brand{fill:var(--brand-tint);stroke:var(--brand);}.d-life{stroke:var(--line-strong);stroke-dasharray:4 5;}.d-arrow{stroke:var(--brand-strong);fill:none;stroke-width:1.8;}.d-back{stroke:var(--muted);fill:none;stroke-width:1.6;stroke-dasharray:6 4;}.d-head{fill:var(--brand-strong);}.d-headm{fill:var(--muted);}.d-num{fill:var(--brand-strong);}.d-numt{font-family:var(--font-sans);fill:var(--on-brand);font-weight:700;}.d-note{fill:var(--surface);stroke:var(--line);}.d-bad{fill:var(--surface);stroke:var(--danger);}.d-badt{font-family:var(--font-mono);fill:var(--danger);}</style><defs><marker id="dck-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker><marker id="dck-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-headm"/></marker></defs><rect class="d-brand" x="320" y="16" width="300" height="56" rx="12"/><text class="d-t" x="470" y="40" font-size="14" text-anchor="middle" direction="rtl" font-weight="700">درخواست داده از سرور تو</text><text class="d-m" x="470" y="59" font-size="11.5" text-anchor="middle" direction="ltr">Authorization: Bearer &lt;Runtime Token&gt;</text><line class="d-arrow" x1="470" y1="74" x2="470" y2="102" marker-end="url(#dck-a)"/><text class="d-s" x="480" y="94" font-size="11.5" text-anchor="start" direction="rtl">بله</text><rect class="d-box" x="300" y="106" width="340" height="44" rx="22"/><text class="d-t" x="470" y="133" font-size="13.5" text-anchor="middle" direction="rtl